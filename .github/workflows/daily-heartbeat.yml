# Writes today's UTC date to heartbeat/daily.txt once per day.
# Uses GITHUB_TOKEN — no PAT required for this workflow.

name: Daily heartbeat

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    name: Commit today's date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write daily heartbeat
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          mkdir -p heartbeat
          file="heartbeat/daily.txt"
          today="$(date -u +%F)"

          if [ -f "$file" ]; then
            last="$(tr -d '[:space:]' < "$file")"
            if [ "$last" = "$today" ]; then
              echo "Already wrote heartbeat for $today; skip."
              exit 0
            fi
            echo "Last heartbeat: $last"
          fi

          printf '%s\n' "$today" > "$file"
          git add "$file"
          if git diff --cached --quiet; then
            echo "No file change to commit."
            exit 0
          fi
          git commit -m "chore: daily heartbeat $today"
          git push
