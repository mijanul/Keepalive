# Writes today's UTC date to heartbeat/monthly.txt at most once every 30 days.
# Uses GITHUB_TOKEN — no PAT required for this workflow.

name: Monthly heartbeat

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    name: Commit date if 30 days passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write heartbeat if due
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          mkdir -p heartbeat
          file="heartbeat/monthly.txt"
          today="$(date -u +%F)"

          if [ -f "$file" ]; then
            last="$(tr -d '[:space:]' < "$file")"
            if [ -n "$last" ]; then
              last_epoch="$(date -u -d "$last" +%s)"
              today_epoch="$(date -u -d "$today" +%s)"
              days="$(( (today_epoch - last_epoch) / 86400 ))"
              echo "Last heartbeat: $last ($days day(s) ago)"
              if [ "$days" -lt 30 ]; then
                echo "Skip commit; waiting until 30 days have passed."
                exit 0
              fi
            fi
          fi

          printf '%s\n' "$today" > "$file"
          git add "$file"
          if git diff --cached --quiet; then
            echo "No file change to commit."
            exit 0
          fi
          git commit -m "chore: monthly heartbeat $today"
          git push
